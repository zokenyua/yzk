name: update-qdii-data

on:
  schedule:
    - cron: '0 2 * * 1-5'    # UTC 02:00 ≈ 北京 10:00（工作日）
    - cron: '30 6 * * 1-5'   # UTC 06:30 ≈ 北京 14:30（收盘前再抓一次）
  workflow_dispatch:          # 支持在 Actions 页手动触发

permissions:
  contents: write             # 允许把生成的 data.json 提交回仓库

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取数据
        run: python scraper/fetch.py   # 仅用标准库，无需 pip install
      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/history/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "update qdii data $(date -u +%FT%TZ)"
            git push
          fi
